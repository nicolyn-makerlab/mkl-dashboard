name: Refresh and deploy dashboard

on:
  schedule:
    # Every 30 minutes, 7am-9pm SGT (UTC+8) on weekdays = 23:00-13:00 UTC
    - cron: "*/30 23-23,0-13 * * 0-4"
  workflow_dispatch: {} # lets you trigger a manual refresh from the Actions tab

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      - name: Build dashboard data
        run: node lib/build.js
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_COMPANIES_DS: ${{ vars.NOTION_COMPANIES_DS }}
          NOTION_CLIENTS_CRM_DS: ${{ vars.NOTION_CLIENTS_CRM_DS }}
          NOTION_TASKS_DS: ${{ vars.NOTION_TASKS_DS }}
          TASK_OWNER_NAME: ${{ vars.TASK_OWNER_NAME }}
          EXCLUDE_COMPANIES: ${{ vars.EXCLUDE_COMPANIES }}
          GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
          GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
          GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}
          TASK_LOOKAHEAD_DAYS: ${{ vars.TASK_LOOKAHEAD_DAYS }}
          MEETING_LOOKAHEAD_DAYS: ${{ vars.MEETING_LOOKAHEAD_DAYS }}
          LAST_CONTACT_YELLOW_DAYS: ${{ vars.LAST_CONTACT_YELLOW_DAYS }}
          LAST_CONTACT_RED_DAYS: ${{ vars.LAST_CONTACT_RED_DAYS }}

      - uses: actions/upload-pages-artifact@v3
        with:
          path: public

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
