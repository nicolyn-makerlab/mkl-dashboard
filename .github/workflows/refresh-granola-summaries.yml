name: Refresh Granola executive summaries

# Deliberately separate from refresh-and-deploy.yml, same reasoning as
# refresh-chat-summaries.yml: summarization calls the Anthropic API, which
# has a real per-call cost, so this runs on its own twice-a-day schedule
# instead of every 30 minutes. Commits granola-summary-cache.json back to
# main; the regular dashboard build just reads that file.
on:
  schedule:
    # ~9am and ~5pm SGT (UTC+8) = 01:00 and 09:00 UTC
    - cron: "0 1,9 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  summarize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - run: npm ci

      - name: Summarize recent Granola notes
        run: node lib/granola-summary.js
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
          NOTION_COMPANIES_DS: ${{ vars.NOTION_COMPANIES_DS }}
          NOTION_CLIENTS_CRM_DS: ${{ vars.NOTION_CLIENTS_CRM_DS }}
          GRANOLA_API_KEY: ${{ secrets.GRANOLA_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit updated cache
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add granola-summary-cache.json
          git diff --staged --quiet || git commit -m "Refresh Granola executive summaries"
          git push
